{% extends "base.html" %}

{% block content_header %}
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Thank You</h1>
{% endblock %}

{% block content %}
    <div class="rounded-xl border border-green-300 bg-green-50 p-8 text-center dark:border-green-700 dark:bg-green-900/30">
        <svg class="mx-auto mb-4 h-14 w-14 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Feedback Submitted</h2>
        <p class="mt-3 text-gray-600 dark:text-gray-400">
            Thank you for taking the time to share your thoughts{% if session %} on {{ session.name }}{% endif %}.
            Your response has been recorded anonymously.
        </p>
    </div>
{% endblock %}
