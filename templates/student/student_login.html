{% extends 'base.html' %}

{% block content_header %}
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">{{ dojo.name }}</h1>
{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <h2 class="mb-1 text-xl font-semibold text-gray-900 dark:text-gray-100">Student Login</h2>
        <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">Enter your email address to sign in.</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="mb-1.5 block">Email Address</label>
                <input type="email" name="email" id="id_email" placeholder="you@example.com" autofocus>
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-red-600 px-4 py-2.5 text-center font-semibold text-white shadow-sm transition hover:bg-red-700 focus:ring-2 focus:ring-red-500/40 focus:outline-none">
                Submit
            </button>
        </form>
    </div>
{% endblock %}
