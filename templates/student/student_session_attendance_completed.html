{% extends 'base.html' %}

{% block content_header %}
    <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/40">
            <svg class="h-7 w-7 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Registration Completed!</h1>
    </div>
{% endblock %}

{% block content %}
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="rounded-xl border border-green-200 bg-green-50 p-8 text-center dark:border-green-800 dark:bg-green-950/30">
        <p class="text-lg font-medium text-green-800 dark:text-green-200">OSU! Completed. Enjoy your karate session!</p>
    </div>
{% endblock %}
