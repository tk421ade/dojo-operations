{% load i18n %}
<div class="mt-2 flex items-center gap-3">
  {% if wizard.steps.prev %}
    <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}" class="btn btn-secondary btn-lg">
      {% trans "Back" %}
    </button>
  {% endif %}
  <button type="submit" class="btn btn-primary btn-lg flex-1">
    {% trans "Continue" %}
  </button>
</div>
{% if cancel_url %}
  <a href="{{ cancel_url }}" class="mt-3 block text-center text-sm font-medium text-gray-500 transition hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100">
    {% trans "Cancel" %}
  </a>
{% endif %}
